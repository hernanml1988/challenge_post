services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: challenge
      POSTGRES_PASSWORD: challenge_local
      POSTGRES_DB: posts_challenge
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgresData:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U challenge -d posts_challenge"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgresData: